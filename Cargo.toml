[workspace]
resolver = "3"
members = [
	"crates/tith",
	"crates/tith-adapter",
	"crates/tith-bso",
	"crates/tith-crypto",
	"crates/tith-config",
	"crates/tith-exchange",
	"crates/tith-ipc",
	"crates/tith-submit",
	"crates/tith-ipc-tcp",
	"crates/tith-ledger",
	"crates/tith-message-legacy",
	"crates/tith-nodelist",
	"crates/tith-nodelist-legacy",
	"crates/tith-router",
	"crates/tith-store",
	"crates/tith-wire",
	"crates/tithd",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "ISC"
repository = "https://github.com/RealDeuce/tith"

[workspace.dependencies]
base64 = "=0.22.1"
libhydrogen-sys = "=0.9.4"
redb = "=4.2.0"
same-file = "=1.0.6"
windows-sys = { version = "=0.61.2", features = [
	"Win32_Foundation",
	"Win32_Security",
	"Win32_Security_Authorization",
	"Win32_Storage_FileSystem",
	"Win32_System_IO",
	"Win32_System_Pipes",
	"Win32_System_Memory",
	"Win32_System_RemoteDesktop",
	"Win32_System_Threading",
] }
nix = { version = "=0.31.3", features = ["socket", "user"] }
tith-crypto = { path = "crates/tith-crypto" }
tith-config = { path = "crates/tith-config" }
tith-ipc-tcp = { path = "crates/tith-ipc-tcp" }
tith-nodelist = { path = "crates/tith-nodelist" }
tith-wire = { path = "crates/tith-wire" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
too_many_lines = "allow"
