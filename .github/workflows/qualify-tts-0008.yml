name: Qualify TSP-0015 for TTS-0008

on:
  push:
    paths:
      - "crates/tith-store/src/key_pin.rs"
      - "crates/tith-store/src/lib.rs"
      - "crates/tith-store/src/outbound.rs"
      - "crates/tith-router/src/lib.rs"
      - "crates/tithd/src/accept.rs"
      - "crates/tithd/src/deliver.rs"
      - "crates/tithd/src/mail.rs"
      - "crates/tithd/src/main.rs"
      - "crates/tithd/src/submission.rs"
      - "qualification/check_source_line_coverage.py"
      - ".github/workflows/qualify-tts-0008.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pinned coverage toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-08-20
          components: llvm-tools-preview

      - name: Install pinned coverage driver
        run: cargo install cargo-llvm-cov --version 0.9.0 --locked

      - name: Exercise the TSP-0015 conformance surface
        run: |
          cargo +nightly-2026-08-20 llvm-cov clean --workspace
          cargo +nightly-2026-08-20 llvm-cov --branch --workspace --json --output-path tts-0015-coverage.json

      - name: Report source coverage
        run: cargo +nightly-2026-08-20 llvm-cov report --branch --text --show-missing-lines

      - name: Require complete conformance coverage
        run: |
          sha256sum tts-0015-coverage.json
          python3 qualification/check_source_line_coverage.py \
            tts-0015-coverage.json \
            crates/tith-store/src/key_pin.rs
