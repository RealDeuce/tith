name: Qualify TTS-0007

on:
  push:
    paths:
      - "standards/TTS-0007.txt"
      - "standards/TTS-0002.txt"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/tith-wire/src/signed_integer.rs"
      - "crates/tith-wire/src/integer.rs"
      - "qualification/check_source_coverage.py"
      - "qualification/TTS-0007.002.md"
      - ".github/workflows/rust.yml"
      - ".github/workflows/qualify-tts-0007.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pinned coverage toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-08-20
          components: llvm-tools-preview

      - name: Install pinned coverage driver
        run: cargo install cargo-llvm-cov --version 0.9.0 --locked

      - name: Exercise the TTS-0007 conformance surface
        run: |
          cargo +nightly-2026-08-20 llvm-cov clean --workspace
          cargo +nightly-2026-08-20 llvm-cov --branch --workspace --json --output-path tts-0007-coverage.json

      - name: Report source coverage
        run: cargo +nightly-2026-08-20 llvm-cov report --branch --text --show-missing-lines

      - name: Require complete conformance coverage
        run: |
          sha256sum tts-0007-coverage.json
          python3 qualification/check_source_coverage.py \
            tts-0007-coverage.json \
            crates/tith-wire/src/signed_integer.rs \
            crates/tith-wire/src/integer.rs
