name: Qualify TTS-0005

on:
  push:
    paths:
      - "standards/TSP-0022.txt"
      - "standards/TTS-0002.txt"
      - "standards/TTS-0003.txt"
      - "standards/TTS-0004.txt"
      - "standards/TTS-0005.txt"
      - "standards/TTS-0008.txt"
      - "standards/TTS-0009.txt"
      - "standards/TTS-0010.txt"
      - ".gitattributes"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/rust.yml"
      - "crates/tith-crypto/Cargo.toml"
      - "crates/tith-crypto/src/hash.rs"
      - "crates/tith-crypto/src/raw.rs"
      - "crates/tith-crypto/src/signature.rs"
      - "crates/tith-crypto/build.rs"
      - "crates/tith-crypto/vendor/**"
      - "crates/tith-wire/src/bundle.rs"
      - "crates/tith-wire/src/bundle_types.rs"
      - "crates/tith-wire/src/item_carrier.rs"
      - "crates/tith-wire/src/item_carrier_tests.rs"
      - "crates/tith-wire/src/item.rs"
      - "crates/tith-exchange/src/lib.rs"
      - "crates/tith-exchange/src/response.rs"
      - "crates/tith-store/src/duplicate_identity.rs"
      - "crates/tith-store/src/inbound_accept.rs"
      - "crates/tith-store/src/inbound_identifier.rs"
      - "crates/tith-store/src/lib.rs"
      - "crates/tith-store/src/outbound.rs"
      - "crates/tith-store/src/poll_snapshot.rs"
      - "crates/tithd/src/mail.rs"
      - "crates/tithd/src/public_key_response.rs"
      - "qualification/check_source_line_coverage.py"
      - "qualification/TTS-0005.017.md"
      - ".github/workflows/qualify-tts-0005.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pinned coverage toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-08-20
          components: llvm-tools-preview

      - name: Install pinned coverage driver
        run: cargo install cargo-llvm-cov --version 0.9.0 --locked

      - name: Exercise the complete reference implementation
        run: cargo test --workspace

      - name: Exercise the TTS-0005 conformance surface
        run: |
          cargo +nightly-2026-08-20 llvm-cov clean --workspace
          cargo +nightly-2026-08-20 llvm-cov --branch --workspace \
            --json --output-path tts-0005-coverage.json

      - name: Report source coverage
        run: cargo +nightly-2026-08-20 llvm-cov report --branch --text --show-missing-lines

      - name: Require complete conformance coverage
        run: |
          sha256sum tts-0005-coverage.json
          python3 qualification/check_source_line_coverage.py \
            tts-0005-coverage.json \
            crates/tith-crypto/src/hash.rs \
            crates/tith-wire/src/bundle.rs \
            crates/tith-wire/src/bundle_types.rs \
            crates/tith-wire/src/item_carrier.rs \
            crates/tith-exchange/src/response.rs \
            crates/tith-store/src/duplicate_identity.rs \
            crates/tith-store/src/inbound_accept.rs \
            crates/tith-store/src/poll_snapshot.rs \
            crates/tithd/src/public_key_response.rs
