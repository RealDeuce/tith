name: Qualify TTS-5001

on:
  push:
    paths:
      - "standards/TTS-5001.txt"
      - "standards/TTS-0004.txt"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/rust.yml"
      - "crates/tith-crypto/src/public_key.rs"
      - "crates/tith-nodelist/src/flags.rs"
      - "crates/tith-nodelist/src/lib.rs"
      - "crates/tith-nodelist/tests/tts5001.rs"
      - "qualification/check_source_line_coverage.py"
      - "qualification/TTS-5001.002.md"
      - ".github/workflows/qualify-tts-5001.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pinned coverage toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-08-20
          components: llvm-tools-preview

      - name: Install pinned coverage driver
        run: cargo install cargo-llvm-cov --version 0.9.0 --locked

      - name: Exercise the complete reference implementation
        run: cargo test --workspace

      - name: Exercise the TTS-5001 conformance surface
        run: |
          cargo +nightly-2026-08-20 llvm-cov clean --workspace
          cargo +nightly-2026-08-20 llvm-cov --branch --workspace --json --output-path tts-5001-coverage.json

      - name: Report source coverage
        run: cargo +nightly-2026-08-20 llvm-cov report --branch --text --show-missing-lines

      - name: Require complete conformance coverage
        run: |
          sha256sum tts-5001-coverage.json
          python3 qualification/check_source_line_coverage.py \
            tts-5001-coverage.json \
            crates/tith-nodelist/src/flags.rs
