name: Diagnose Windows key recovery

on:
  push:
    branches: [issue-146-windows-diagnostics]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unmodified-windows:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f9ce8794e18cd085b8760e554880b897d452c969
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
      - name: Build the unmodified publishing commit
        run: cargo test --package tithd --no-run
      - name: Repeat unmodified recovery and concurrent daemon tests
        shell: pwsh
        run: |
          function Invoke-BoundedTest([string[]] $TestArguments) {
            $test = Start-Process cargo -ArgumentList $TestArguments -NoNewWindow -PassThru
            if (-not $test.WaitForExit(90000)) {
              taskkill /PID $test.Id /T /F
              throw "Unmodified test exceeded 90 seconds: $TestArguments"
            }
            if ($test.ExitCode -ne 0) { exit $test.ExitCode }
          }
          1..20 | ForEach-Object {
            Write-Host "Unmodified isolated recovery repetition $_"
            Invoke-BoundedTest @('test', '--package', 'tithd', 'mail::tests::authentication_failure_probes_the_predecessor_and_retries_once', '--', '--exact', '--nocapture')
          }
          1..5 | ForEach-Object {
            Write-Host "Unmodified concurrent daemon repetition $_"
            Invoke-BoundedTest @('test', '--package', 'tithd', '--', '--nocapture')
          }

  native-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
      - name: Repeat isolated recovery on native Windows
        shell: pwsh
        run: |
          1..20 | ForEach-Object {
            Write-Host "Isolated recovery repetition $_"
            cargo test --package tithd mail::tests::authentication_failure_probes_the_predecessor_and_retries_once -- --exact --nocapture
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Repeat concurrent daemon tests on native Windows
        shell: pwsh
        run: |
          1..5 | ForEach-Object {
            Write-Host "Concurrent daemon repetition $_"
            cargo test --package tithd -- --nocapture
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
