name: Verify Windows key recovery

on:
  push:
    branches: [issue-146-windows-diagnostics]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-control:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
      - name: Verify the regression fails without the socket-close fix
        shell: pwsh
        run: |
          git restore --source=f9ce8794e18cd085b8760e554880b897d452c969 -- crates/tithd/src/client_exchange.rs crates/tithd/src/deliver.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --package tithd --no-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --package tithd mail::tests::authentication_failure_closes_a_poll_before_probing_the_predecessor -- --exact --nocapture 2>&1 | Tee-Object -FilePath regression-control.log
          $testExit = $LASTEXITCODE
          $log = Get-Content -Raw regression-control.log
          if ($testExit -ne 101 -or -not $log.Contains('state=Deferred')) {
            throw "Expected the unpatched Poll recovery to fail with its delivery deferred"
          }
          Write-Host "Confirmed: the same regression fails without the socket-close fix"
          exit 0

  native-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
      - name: Repeat both recovery regressions on native Windows
        shell: pwsh
        run: |
          1..50 | ForEach-Object {
            Write-Host "Recovery repetition $_"
            cargo test --package tithd mail::tests::authentication_failure_ -- --nocapture
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Repeat concurrent daemon tests on native Windows
        shell: pwsh
        run: |
          1..5 | ForEach-Object {
            Write-Host "Concurrent daemon repetition $_"
            cargo test --package tithd -- --nocapture
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
